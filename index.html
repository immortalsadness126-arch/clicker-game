<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crypto Clicker</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #111116;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Запрещаем выделение текста и элементов на всей странице */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }
        #score-text {
            font-size: 38px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 35px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }
        #coin-btn {
            width: 180px;
            height: 180px;
            background-color: #ff9900;
            border: 8px solid #ffcc00;
            border-radius: 50%;
            font-size: 70px;
            color: white;
            cursor: pointer;
            outline: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(255, 153, 0, 0.4);
            
            /* ХАК: Полностью убираем синий квадрат и любые выделения при тапе */
            -webkit-tap-highlight-color: transparent;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            outline: none !important;
        }
        #coin-btn:active {
            transform: scale(0.92);
            background-color: #e68a00;
        }
        .hint {
            color: #aaaaaa;
            font-size: 14px;
            margin-top: 45px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="score-text">💰 <span id="balance-val">0</span></div>
        <button id="coin-btn">🪙</button>
        <p class="hint">Нажимай на монету, баланс сохранится автоматически!</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        try {
            tg.ready();
            tg.expand();
        } catch(e) {}

        // Загружаем сохраненный баланс из локального хранилища устройства
        let currentBalance = parseInt(localStorage.getItem('clicker_score')) || 0;
        
        const balanceDisplay = document.getElementById('balance-val');
        const coinButton = document.getElementById('coin-btn');

        // Сразу отображаем баланс при входе
        balanceDisplay.innerText = currentBalance;

        // Логика клика
        coinButton.addEventListener('click', () => {
            currentBalance++;
            balanceDisplay.innerText = currentBalance;
            
            // Надежное мгновенное сохранение в память телефона
            localStorage.setItem('clicker_score', currentBalance);
            
            // Тактильный отклик (вибрация) внутри Telegram
            try {
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }
            } catch(e) {}
        });
    </script>
</body>
</html>
