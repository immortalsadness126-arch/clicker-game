<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Crypto Clicker v2.0</title>
    <script src="https://telegram.org"></script>
    <style>
        /* Блокируем выделение ВЕЗДЕ */
        * {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            outline: none !important;
        }
        body {
            background-color: #111116;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }
        #score-text {
            font-size: 42px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 30px;
        }
        /* Монетка через обычный DIV, так как кнопки BUTTON часто принудительно подсвечиваются операционной системой */
        #coin-btn {
            width: 180px;
            height: 180px;
            background: linear-gradient(145deg, #ffb300, #e68a00);
            border: 6px solid #ffcc00;
            border-radius: 50%;
            font-size: 80px;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 12px 20px rgba(255, 153, 0, 0.3);
            margin: 0 auto;
            transition: transform 0.05s ease;
        }
        #coin-btn:active {
            transform: scale(0.92);
        }
        .hint {
            color: #aaaaaa;
            font-size: 13px;
            margin-top: 40px;
        }
        #debug-log {
            color: #ff3333;
            font-size: 11px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="score-text">💰 <span id="balance-val">0</span></div>
        <div id="coin-btn">🪙</div>
        <p class="hint">v2.0 • Тапай по монете</p>
        <div id="debug-log"></div>
    </div>

    <script>
        const debug = document.getElementById('debug-log');
        let currentBalance = 0;

        try {
            const tg = window.Telegram.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
            }

            // Загрузка баланса с защитой от сбоев
            try {
                currentBalance = parseInt(localStorage.getItem('clicker_score')) || 0;
            } catch(e) {
                debug.innerText = "Ошибка памяти: " + e.message;
            }
            
            const balanceDisplay = document.getElementById('balance-val');
            const coinButton = document.getElementById('coin-btn');

            balanceDisplay.innerText = currentBalance;

            // Клик
            coinButton.addEventListener('click', () => {
                try {
                    currentBalance++;
                    balanceDisplay.innerText = currentBalance;
                    localStorage.setItem('clicker_score', currentBalance);
                    
                    if (tg && tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('medium');
                    }
                } catch(clickErr) {
                    debug.innerText = "Ошибка клика: " + clickErr.message;
                }
            });

        } catch(mainErr) {
            debug.innerText = "Критическая ошибка: " + mainErr.message;
        }
    </script>
</body>
</html>
